<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f5" />
    <meta name="description" content="Snowdrop — a little clarity in a world of conversation. Your media monitoring workspace." />
    <link rel="icon" type="image/svg+xml" href="/snowdrop.svg" />
    <script>
      try {
        const preference = localStorage.getItem('snowdrop-theme');
        const dark = preference ? preference === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>Snowdrop · Your listening space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
